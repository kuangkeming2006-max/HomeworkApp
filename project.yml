name: HomeworkApp
# Adapted from hoangnd107/ios-swiftui-app-template, ee99d6508ce6d3a75a12b0c3fff8ac5089edf0f2.
# Keep this file as the source of truth; generate, never commit, the Xcode project.
options:
  bundleIdPrefix: com.kkm.homework
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  xcodeVersion: "27.0"
  minimumXcodeGenVersion: "2.46.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  HomeworkDomain:
    path: Packages/HomeworkDomain
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    TEST_ORIENTATION: portrait
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "4"
targets:
  HomeworkApp:
    type: application
    platform: iOS
    sources:
      - HomeworkApp
      - Resources
      - Shared
    dependencies:
      - package: HomeworkDomain
      - target: HomeworkWidgets
        embed: true
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.kkm.homework
            CFBundleURLSchemes: [homework]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kkm.homework
        PRODUCT_NAME: HomeworkApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Homework
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTS_MACCATALYST: NO
  HomeworkWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HomeworkWidgets
      - Shared
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Homework Deadlines
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kkm.homework.widgets
        PRODUCT_NAME: HomeworkWidgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  HomeworkAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/IntegrationTests
    dependencies:
      - target: HomeworkApp
      - package: HomeworkDomain
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  HomeworkAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UITests
    dependencies:
      - target: HomeworkApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HomeworkApp:
    build:
      targets:
        HomeworkApp: all
        HomeworkAppTests: [test]
        HomeworkAppUITests: [test]
    test:
      gatherCoverageData: true
      macroExpansion: HomeworkApp
      environmentVariables:
        TEST_ORIENTATION: $(TEST_ORIENTATION)
      targets:
        - HomeworkAppTests
        - HomeworkAppUITests
    archive:
      config: Release
