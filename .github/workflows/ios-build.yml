# Adapted from the template's ios-build.yml. Shared with the release workflow.
name: iOS Build (Unsigned IPA)
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      XCODE_VERSION: latest-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/select_xcode.py
      - run: python3 scripts/install_xcodegen.py
      - run: .tools/bin/xcodegen generate
      - name: Build unsigned iPhoneOS app and package Payload IPA
        run: python3 scripts/run_apple.py device
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unsigned-device-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14
