name: iPhone build and interaction preview
on:
  push:
    paths:
      - 'HomeworkApp/**'
      - 'HomeworkWidgets/**'
      - 'Shared/**'
      - 'Packages/**'
      - 'project.yml'
      - 'Tests/UITests/InteractionPreviewTests.swift'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iphone-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      XCODE_VERSION: latest-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/select_xcode.py
      - run: python3 scripts/install_xcodegen.py
      - run: .tools/bin/xcodegen generate
      - name: Build, launch and capture changed iPhone interactions
        run: python3 scripts/run_apple.py simulator --family phone --appearance light --orientation portrait --test-scope preview
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: iphone-interaction-preview
          path: artifacts/
          retention-days: 14
  unsigned-device:
    uses: ./.github/workflows/ios-build.yml
